app-id: io.github.ArthurD.NativMix
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.11"
command: nativmix

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=home/.config/nativmix:create
  - --filesystem=home/.cache/nativmix:create

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man

modules:
  - name: portmidi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPORTMIDI_ENABLE_TEST=OFF
      - -DPORTMIDI_ENABLE_STATIC=OFF
    sources:
      - type: archive
        url: https://github.com/PortMidi/portmidi/archive/refs/tags/v2.0.4.tar.gz
        sha256: 64893e823ae146cabd3ad7f9a9a9c5332746abe7847c557b99b2577afa8a607c

  - python3-deps.json

  - name: nativmix
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=${FLATPAK_DEST} .
      - install -Dm644 flatpak/io.github.ArthurD.NativMix.metainfo.xml /app/share/metainfo/io.github.ArthurD.NativMix.metainfo.xml
      - install -Dm644 flatpak/io.github.ArthurD.NativMix.desktop /app/share/applications/io.github.ArthurD.NativMix.desktop
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/io.github.ArthurD.NativMix.png
    sources:
      - type: dir
        path: ..
