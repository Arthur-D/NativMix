name: AUR Deploy

# AUR SSH git writes are disabled for community accounts while Arch handles
# malicious package adoptions/commits (official: pushes disabled altogether).
# Retries + schedule keep trying until packaging/aur matches AUR.
# https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/message/YPJ3FQYJTJXXY3RUXCYLMHUKHLIUNVFF/
# https://bbs.archlinux.org/viewtopic.php?pid=2306487

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # Keep probing while AUR SSH write is intermittently/blocked
    - cron: '15 */4 * * *'

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.NATIVMIX_AUR_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          # Per-attempt wait (seconds) and max attempts for clone/push
          AUR_RETRY_SLEEP: '120'
          AUR_RETRY_MAX: '90'
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "ERROR: secret NATIVMIX_AUR_KEY is empty or missing"
            exit 1
          fi

          PKGVER="$(python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as source:
              print(tomllib.load(source)["project"]["version"])
          PY
          )"
          PKGREL="$(sed -n 's/^pkgrel=//p' packaging/aur/PKGBUILD | head -1)"
          RELEASE_TAG="v${PKGVER}"
          WANT_VER="${PKGVER}-${PKGREL}"
          echo "Wanted AUR version: ${WANT_VER}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ] \
            && [ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]; then
            echo "ERROR: pushed tag ${GITHUB_REF_NAME} does not match project version ${RELEASE_TAG}"
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "Release tag ${RELEASE_TAG} does not exist yet; nothing to publish."
              exit 0
            fi
            echo "ERROR: release tag ${RELEASE_TAG} does not exist"
            exit 1
          fi

          # Skip scheduled runs when AUR already has this version (HTTPS RPC works while SSH write does not)
          AUR_VER="$(curl -fsSL "https://aur.archlinux.org/rpc/v5/info?arg[]=nativmix" \
            | python3 -c 'import sys,json; r=json.load(sys.stdin)["results"]; print(r[0]["Version"] if r else "")')"
          echo "Current AUR version: ${AUR_VER:-<unknown>}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ -n "${AUR_VER}" ] && [ "${AUR_VER}" = "${WANT_VER}" ]; then
            echo "AUR already at ${WANT_VER}; nothing to do on schedule."
            exit 0
          fi

          # 1. Setup SSH — accept PEM private key OR base64(PEM) (paste-safe)
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/id_ed25519
          RAW="$(printf '%s' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r')"

          write_key() {
            printf '%s\n' "$1" > "$KEY_FILE"
            if [ -n "$(tail -c1 "$KEY_FILE" 2>/dev/null || true)" ]; then
              printf '\n' >> "$KEY_FILE"
            fi
            chmod 600 "$KEY_FILE"
          }

          if printf '%s' "$RAW" | grep -q 'BEGIN .*PRIVATE KEY'; then
            if printf '%s' "$RAW" | grep -q $'\n'; then
              write_key "$RAW"
            else
              write_key "$(printf '%s' "$RAW" | sed 's/\\n/\n/g')"
            fi
          else
            if DECODED="$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 -d 2>/dev/null)" \
              && printf '%s' "$DECODED" | grep -q 'BEGIN .*PRIVATE KEY'; then
              write_key "$DECODED"
              echo "Decoded NATIVMIX_AUR_KEY from base64"
            else
              echo "ERROR: NATIVMIX_AUR_KEY is neither a PEM private key nor base64(PEM)."
              exit 1
            fi
          fi

          echo "Key file lines: $(wc -l < "$KEY_FILE")  bytes: $(wc -c < "$KEY_FILE")"
          echo "Key header: $(head -1 "$KEY_FILE")"
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$KEY_FILE"; then
            echo "ERROR: NATIVMIX_AUR_KEY does not look like a PEM private key (missing BEGIN line)."
            exit 1
          fi

          if ! ssh-keygen -y -f "$KEY_FILE" >/tmp/aur_pubkey 2>/tmp/aur_keyerr; then
            echo "ERROR: OpenSSH cannot load NATIVMIX_AUR_KEY (libcrypto)."
            cat /tmp/aur_keyerr || true
            exit 1
          fi
          echo "AUR deploy key fingerprint:"
          ssh-keygen -lf /tmp/aur_pubkey

          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          {
            echo 'Host aur.archlinux.org'
            echo '  User aur'
            echo '  IdentityFile ~/.ssh/id_ed25519'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking accept-new'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # Auth banner can succeed while git write is still "maintenance"
          echo "Testing SSH auth to AUR..."
          ssh -T aur@aur.archlinux.org 2>&1 | tee /tmp/aur_ssh_hello || true
          if ! grep -Eiq 'welcome to aur|hi[[:space:]]' /tmp/aur_ssh_hello; then
            echo "ERROR: AUR SSH auth failed (no welcome/Hi greeting)."
            exit 1
          fi

          is_aur_write_up() {
            # "help" fails with the same maintenance banner as git while write is locked
            out="$(ssh -o BatchMode=yes -o ConnectTimeout=20 aur@aur.archlinux.org help 2>&1 || true)"
            if printf '%s' "$out" | grep -qi 'maintenance'; then
              return 1
            fi
            if printf '%s' "$out" | grep -Eiq 'commands|git-receive|usage|available'; then
              return 0
            fi
            # Unknown response: treat as not ready
            printf '%s\n' "$out" | head -5
            return 1
          }

          echo "Waiting for AUR SSH write access (not just auth)..."
          attempt=1
          while [ "$attempt" -le "$AUR_RETRY_MAX" ]; do
            if is_aur_write_up; then
              echo "AUR SSH write appears up (attempt ${attempt})."
              break
            fi
            echo "AUR still read-only/maintenance (attempt ${attempt}/${AUR_RETRY_MAX}); sleep ${AUR_RETRY_SLEEP}s..."
            if [ "$attempt" -eq "$AUR_RETRY_MAX" ]; then
              echo "ERROR: AUR SSH write still unavailable after ${AUR_RETRY_MAX} attempts."
              echo "Scheduled runs will keep retrying."
              echo "Official: https://lists.archlinux.org/archives/list/aur-general@lists.archlinux.org/message/YPJ3FQYJTJXXY3RUXCYLMHUKHLIUNVFF/"
              echo "Forum: https://bbs.archlinux.org/viewtopic.php?pid=2306487"
              exit 1
            fi
            sleep "$AUR_RETRY_SLEEP"
            attempt=$((attempt + 1))
          done

          # 2. Clone AUR repo (retry — write can flap)
          rm -rf /tmp/aur-repo
          attempt=1
          while [ "$attempt" -le 10 ]; do
            if git clone ssh://aur@aur.archlinux.org/nativmix.git /tmp/aur-repo; then
              break
            fi
            echo "git clone failed (attempt ${attempt}/10); sleep ${AUR_RETRY_SLEEP}s..."
            rm -rf /tmp/aur-repo
            if [ "$attempt" -eq 10 ]; then
              echo "ERROR: git clone failed after retries"
              exit 1
            fi
            sleep "$AUR_RETRY_SLEEP"
            attempt=$((attempt + 1))
          done

          # 3. Copy files
          cp packaging/aur/PKGBUILD packaging/aur/nativmix.install /tmp/aur-repo/
          cd /tmp/aur-repo
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i 's|^url=.*|url="https://github.com/Arthur-D/NativMix"|' PKGBUILD
          sed -i 's|github.com/knoelliX/NativMix/archive|github.com/Arthur-D/NativMix/archive|' PKGBUILD

          # 4. Generate Checksums and .SRCINFO
          chmod 777 .
          docker run --rm -v "$(pwd):/pkg" -w /pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm pacman-contrib binutils sudo &&
            useradd -m builder &&
            chown -R builder /pkg &&
            su builder -c 'updpkgsums && makepkg --printsrcinfo' > .SRCINFO"

          sudo chown -R "$USER:$USER" .

          # 5. Config Git and Push (retry push)
          git config --global --add safe.directory /tmp/aur-repo
          git config user.name "Arthur-D"
          git config user.email "magnedj@pm.me"
          git add PKGBUILD nativmix.install .SRCINFO
          git commit -m "Update to ${RELEASE_TAG} (automatic checksums)" || echo "No changes to commit"

          attempt=1
          while [ "$attempt" -le 10 ]; do
            if git push origin master; then
              echo "AUR push succeeded."
              exit 0
            fi
            echo "git push failed (attempt ${attempt}/10); sleep ${AUR_RETRY_SLEEP}s..."
            if [ "$attempt" -eq 10 ]; then
              echo "ERROR: git push failed after retries"
              exit 1
            fi
            sleep "$AUR_RETRY_SLEEP"
            attempt=$((attempt + 1))
          done
