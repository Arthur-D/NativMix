name: AUR Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Deploy to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.NATIVMIX_AUR_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "ERROR: secret NATIVMIX_AUR_KEY is empty or missing"
            exit 1
          fi

          # 1. Setup SSH — accept PEM private key OR base64(PEM) (paste-safe)
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/id_ed25519
          RAW="$(printf '%s' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r')"

          write_key() {
            printf '%s\n' "$1" > "$KEY_FILE"
            # OpenSSH requires a trailing newline; ensure exactly one at EOF
            if [ -n "$(tail -c1 "$KEY_FILE" 2>/dev/null || true)" ]; then
              printf '\n' >> "$KEY_FILE"
            fi
            chmod 600 "$KEY_FILE"
          }

          if printf '%s' "$RAW" | grep -q 'BEGIN .*PRIVATE KEY'; then
            # PEM with real newlines, or single-line with literal \n
            if printf '%s' "$RAW" | grep -q $'\n'; then
              write_key "$RAW"
            else
              write_key "$(printf '%s' "$RAW" | sed 's/\\n/\n/g')"
            fi
          else
            # Prefer base64 one-liner (recommended for GitHub secrets)
            if DECODED="$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 -d 2>/dev/null)" \
              && printf '%s' "$DECODED" | grep -q 'BEGIN .*PRIVATE KEY'; then
              write_key "$DECODED"
              echo "Decoded NATIVMIX_AUR_KEY from base64"
            else
              echo "ERROR: NATIVMIX_AUR_KEY is neither a PEM private key nor base64(PEM)."
              echo "Set it with (from the machine that has the private key file):"
              echo "  gh secret set NATIVMIX_AUR_KEY < ~/.ssh/nativmix_aur_deploy"
              echo "or paste base64 -w0 of that file (one line, no spaces)."
              exit 1
            fi
          fi

          echo "Key file lines: $(wc -l < "$KEY_FILE")  bytes: $(wc -c < "$KEY_FILE")"
          echo "Key header: $(head -1 "$KEY_FILE")"
          if ! grep -q 'BEGIN .*PRIVATE KEY' "$KEY_FILE"; then
            echo "ERROR: NATIVMIX_AUR_KEY does not look like a PEM private key (missing BEGIN line)."
            exit 1
          fi

          # Fail early if OpenSSL/libcrypto cannot parse the key
          if ! ssh-keygen -y -f "$KEY_FILE" >/tmp/aur_pubkey 2>/tmp/aur_keyerr; then
            echo "ERROR: OpenSSH cannot load NATIVMIX_AUR_KEY (libcrypto)."
            cat /tmp/aur_keyerr || true
            echo "The GitHub secret content is still invalid (local ssh working does not update the secret)."
            echo "Fix with file redirect (no copy-paste):"
            echo "  gh secret set NATIVMIX_AUR_KEY < ~/.ssh/nativmix_aur_deploy"
            exit 1
          fi
          echo "AUR deploy key fingerprint:"
          ssh-keygen -lf /tmp/aur_pubkey

          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          # Keep every line indented for YAML; write SSH config without leading spaces
          {
            echo 'Host aur.archlinux.org'
            echo '  User aur'
            echo '  IdentityFile ~/.ssh/id_ed25519'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          # AUR success banners vary: "Hi <user>!" or "Welcome to AUR, <user>!"
          echo "Testing SSH auth to AUR..."
          ssh -T aur@aur.archlinux.org 2>&1 | tee /tmp/aur_ssh_hello || true
          if ! grep -Eiq 'welcome to aur|hi[[:space:]]' /tmp/aur_ssh_hello; then
            echo "ERROR: AUR SSH auth failed (no welcome/Hi greeting)."
            echo "Check that NATIVMIX_AUR_KEY matches an SSH key on your AUR account."
            echo "Paru/HTTPS can work while SSH push access is broken."
            exit 1
          fi

          # 2. Clone AUR repo
          git clone ssh://aur@aur.archlinux.org/nativmix.git /tmp/aur-repo

          # 3. Copy files to local temp folder
          cp packaging/aur/PKGBUILD packaging/aur/nativmix.install /tmp/aur-repo/
          cd /tmp/aur-repo

          # 4. Generate Checksums and .SRCINFO
          chmod 777 .
          docker run --rm -v "$(pwd):/pkg" -w /pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm pacman-contrib binutils sudo &&
            useradd -m builder &&
            chown -R builder /pkg &&
            su builder -c 'updpkgsums && makepkg --printsrcinfo' > .SRCINFO"

          sudo chown -R "$USER:$USER" .

          # 5. Config Git and Push
          git config --global --add safe.directory /tmp/aur-repo
          git config user.name "knoelliX"
          git config user.email "moellix@knoellix.net"
          git add PKGBUILD nativmix.install .SRCINFO
          git commit -m "Update to ${GITHUB_REF_NAME} (automatic checksums)" || echo "No changes to commit"
          git push origin master
