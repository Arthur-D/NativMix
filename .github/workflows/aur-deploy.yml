name: AUR Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: nativmix
          pkgbuild: ./PKGBUILD
          commit_username: ${{ github.repository_owner }}
          commit_email: moellix@knoellix.net
          ssh_private_key: ${{ secrets.NATIVMIX_AUR_KEY }}
          commit_message: "Update to v${{ github.ref_name }}"
          updpkgsums: true