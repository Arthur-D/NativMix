name: AUR Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish to AUR
        uses: bksalman/aur-push@v3
        with:
          pkgname: nativmix
          # Dein Secret-Name bleibt gleich
          ssh_private_key: ${{ secrets.NATIVMIX_AUR_KEY }}
          commit_message: "Update to v${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ed25519
          # Diese Action nimmt standardmäßig alles mit, was im Repo liegt