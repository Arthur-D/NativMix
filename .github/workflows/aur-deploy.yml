name: AUR Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.NATIVMIX_AUR_KEY }}
        run: |
          # 1. Setup SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          # 2. Clone AUR repo (empty or existing)
          git clone ssh://aur@aur.archlinux.org/nativmix.git /tmp/aur-repo

          # 3. Copy files to AUR directory
          cp PKGBUILD nativmix.install /tmp/aur-repo/
          cd /tmp/aur-repo

          # 4. Generate .SRCINFO (essential for AUR)
          # We use a non-root user workaround inside the container
          docker run --rm -v "$(pwd):/pkg" -w /pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm pacman-contrib binutils && 
            useradd -m builder && 
            chown -R builder /pkg && 
            sudo -u builder makepkg --printsrcinfo > .SRCINFO"

          # 5. Config Git and Push
          git config user.name "knoelliX"
          git config user.email "moellix@knoellix.net"
          git add PKGBUILD nativmix.install .SRCINFO
          git commit -m "Update to ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin master