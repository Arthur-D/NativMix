name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your request related to a problem? Describe it.
      placeholder: "I always have trouble when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches or workarounds you've tried?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GUI
        - Hardware / Arduino
        - MIDI
        - Audio routing / PipeWire
        - Virtual Sinks
        - Configuration
        - Packaging / Installation
        - Other
    validations:
      required: true
