[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nativmix"
version = "1.0.0"
description = "A hardware-assisted volume mixer for PipeWire/PulseAudio with Arduino support"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Christian Möllmann (knoelliX)" }]
requires-python = ">=3.10"
keywords = ["audio", "mixer", "pipewire", "pulseaudio", "arduino", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]

dependencies = [
    "PyQt6>=6.6",
    "pulsectl>=23.5.2",
    "pyserial>=3.5",
    "setproctitle>=1.3",
]

[project.optional-dependencies]
# Windows-only backend (prepared for future implementation)
windows = [
    "pycaw>=20230407",
    "comtypes>=1.2",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
nativmix = "nativmix.main:main"

[project.urls]
Homepage = "https://github.com/knoelliX/NativMix"
Repository = "https://github.com/knoelliX/NativMix"
Issues = "https://github.com/knoelliX/NativMix/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["lib"]
include = ["nativmix*"]

[tool.setuptools.package-data]
nativmix = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
