<style>
#nv{--nv-bg:light-dark(#eff0f1,#1b1b1d);--nv-field:light-dark(#fcfcfc,#303034);--nv-text:light-dark(#232629,#eff0f1);--nv-sub:light-dark(#50565c,#bcc1c7);--nv-border:light-dark(#aeb4ba,#56565b);--nv-accent:light-dark(#176da3,#7cc4ef);--nv-selected:light-dark(#dfedf7,#293e4b);background:var(--nv-bg);color:var(--nv-text);border:1px solid var(--nv-border);border-radius:5px;font:14px/1.45 system-ui,sans-serif;padding:10px;container-type:inline-size;overflow-wrap:anywhere}
#nv *{box-sizing:border-box}#nv button,#nv input,#nv select{font:inherit;color:inherit}#nv button,#nv select,#nv input[type=text]{border:1px solid var(--nv-border);border-radius:4px;background:var(--nv-field);padding:6px 9px;min-height:34px;max-width:100%}#nv button{cursor:pointer}#nv button:hover,#nv summary:hover{border-color:var(--nv-accent)}#nv button[aria-pressed=true]{background:var(--nv-selected);border-color:var(--nv-accent);color:var(--nv-accent)}#nv button:disabled{opacity:.5;cursor:default}#nv .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#nv .grow{flex:1}#nv .profile{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#nv .check{display:flex;gap:6px;align-items:center;min-height:34px}#nv input[type=checkbox],#nv input[type=radio]{accent-color:var(--nv-accent)}#nv .settings{border:1px solid var(--nv-border);border-radius:4px;padding:12px;margin:10px 0 14px}#nv .settings h2{font-size:14px;font-weight:500;text-align:center;margin:0 0 10px}#nv .fields{display:flex;gap:12px;flex-wrap:wrap;align-items:end}#nv .fields>label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1 1 210px}#nv .fields select{flex:1;min-width:0}#nv .sub{color:var(--nv-sub)}#nv details{margin-top:8px}#nv summary{cursor:pointer;min-height:34px;align-content:center}#nv .settings details{border-top:1px solid var(--nv-border);padding-top:6px}#nv .strips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;margin-top:15px}#nv .strip{min-width:0;text-align:center;padding:6px 10px 14px;border-right:1px solid var(--nv-border);border-bottom:1px solid var(--nv-border)}#nv .strip:last-child{border-right:0}#nv .mute{min-width:78px}#nv .level{display:block;color:var(--nv-accent);font-size:16px;font-variant-numeric:tabular-nums;margin:7px 0}#nv .fader{display:flex;justify-content:center;height:184px;margin-bottom:8px}#nv .fader input{writing-mode:vertical-lr;direction:rtl;appearance:auto;accent-color:var(--nv-accent);width:32px;height:180px;margin:0}#nv .channel-name{display:block;font-weight:500}#nv .id{font-size:12px;color:var(--nv-sub)}#nv .divider{border:0;border-top:1px solid var(--nv-border);margin:10px 0}#nv .target,#nv .options{width:100%;text-align:left;padding:0;border:0}#nv .target summary{background:var(--nv-field);border:1px solid var(--nv-border);border-radius:4px;padding:6px 8px;list-style:none;display:flex;justify-content:space-between;gap:4px}#nv .target summary:after{content:'▾'}#nv .menu{background:var(--nv-field);border:1px solid var(--nv-border);border-radius:3px;padding:8px;margin-top:4px}#nv .menu fieldset{padding:0;border:0;margin:0 0 8px}#nv .menu legend{font-weight:500;color:var(--nv-sub);margin-top:4px}#nv .menu .check{align-items:flex-start;padding:4px 0;min-height:32px}#nv .menu input{margin-top:4px}#nv .menu .apply{width:100%;background:var(--nv-selected)}#nv .tiny{font-size:12px;color:var(--nv-sub);margin:7px 0}#nv .options input[type=text]{width:100%}#nv .options .check{text-align:left}#nv .options button{width:100%;margin:4px 0}#nv .vs{justify-content:center}#nv .bottom{margin:14px 0 8px}#nv .status{border-top:1px solid var(--nv-border);padding-top:9px;color:var(--nv-sub);font-size:12px}#nv #nv-feedback{min-height:20px;color:var(--nv-accent);margin:7px 0}#nv .demo{margin:12px -10px -10px;padding:9px 10px;border-top:1px solid var(--nv-border);font-size:12px}#nv .demo select{font-size:13px}#nv .notice{padding:12px;margin-top:12px;background:light-dark(#fff1dc,#3d3224);color:light-dark(#764510,#ffd79e);border:1px solid var(--nv-border);border-radius:4px}#nv .notice p{margin:0 0 8px}#nv .empty{text-align:center;padding:40px 14px}#nv .empty h2{font-size:17px;font-weight:500}#nv .ghost{height:270px;background:var(--nv-field);border:1px solid var(--nv-border);margin:8px}#nv .compact .target,#nv .compact .vs,#nv .compact .options,#nv .compact .availability{display:none}#nv .compact .strips{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}#nv [hidden]{display:none!important}#nv .editmark{justify-content:center}#nv .profile-form{padding:12px;border:1px solid var(--nv-border);margin-top:10px}#nv .profile-form input{flex:1;min-width:100px}@container(max-width:550px){#nv .grow{display:none}#nv .bar{gap:8px}#nv .profile{flex:1 1 180px}#nv .profile select{flex:1;min-width:0}#nv .strips{grid-template-columns:repeat(2,minmax(0,1fr))}#nv .strip{padding:8px}#nv .settings .fields>label{flex-basis:100%;display:block}#nv .settings .fields>label select{display:block;width:100%;margin-top:4px}#nv .settings select{max-width:100%}#nv .status span{flex-basis:100%}}@media(pointer:coarse){#nv button,#nv select,#nv summary,#nv .check{min-height:44px}#nv input[type=text],#nv select{font-size:16px}}
</style>
<div id="nv" lang="nb" aria-label="NativMix – forsiktig forbedring av eksisterende grensesnitt">
<div class="bar"><button id="nv-settings-toggle" aria-expanded="false" aria-controls="nv-settings">▸ Innstillinger</button><label class="profile">Profil <select id="nv-profile" aria-label="Profil og profilhandlinger"></select></label><span class="grow"></span><label class="check"><input id="nv-compact" type="checkbox">Kompakt</label><label class="check"><input type="checkbox" id="nv-stay">Hold åpent</label></div>
<div class="profile-form" id="nv-profile-form" hidden><form id="nv-profile-submit" class="bar"><label for="nv-profile-name">Profilnavn</label><input id="nv-profile-name" type="text" required><button type="submit">Lagre</button><button id="nv-profile-cancel" type="button">Avbryt</button></form><p id="nv-profile-error" role="alert"></p></div>
<section class="settings" id="nv-settings" hidden><h2>Innstillinger</h2><div class="fields"><label>Inndatamodus <select id="nv-mode"><option value="hybrid">USB + MIDI</option><option value="usb">Kun USB</option><option value="midi">Kun MIDI</option></select></label><label id="nv-midi-field">MIDI-enhet <select><option>nanoKONTROL2</option><option>NativMix (virtuell port)</option></select></label></div><div class="fields" style="margin-top:10px"><label id="nv-usb-field">USB-port <select><option>/dev/ttyACM0 · Leonardo</option><option>Automatisk</option></select></label><label>Hovedutgang <select><option>Focusrite Scarlett Solo</option><option>Innebygd lyd</option></select></label></div><details><summary>Fjernkontroll · Lokal</summary><label class="profile">Rolle <select id="nv-remote"><option>Lokal</option><option>Send kontroller</option><option>Motta kontroller</option></select></label><p class="tiny">Tilkoblingsflyten er ikke simulert i denne prototypen.</p></details><details><summary>Lyd, MIDI og oppførsel</summary><label class="check"><input type="checkbox">Synkroniser fadere og dempelys til MIDI-kontroller</label><label class="profile">Lydruting <select><option>Automatisk</option><option>NativMix</option><option>Easy Effects</option><option>Ingen</option></select></label><label class="check"><input type="checkbox">Start ved innlogging</label><label class="check"><input type="checkbox">Gjenopprett profilens volum</label><p class="tiny">Øvrige avanserte innstillinger videreføres ved implementering.</p></details></section>
<div id="nv-mixer"></div><div class="bar bottom"><button id="nv-add">+ MIDI-kanal</button><button id="nv-edit" aria-pressed="false">Rediger MIDI-kanaler</button><button id="nv-delete" hidden>Slett valgte</button></div><div id="nv-feedback" role="status" aria-live="polite"></div><div class="bar status"><span id="nv-audio">Lyd tilkoblet</span><span id="nv-device">USB tilkoblet · MIDI tilkoblet</span><span class="grow"></span><span>NativMix · Lokal mikser</span></div><div class="bar demo"><strong>Prototype</strong><label for="nv-state">Vis tilstand</label><select id="nv-state"><option value="ready">Klar</option><option value="loading">Laster</option><option value="error">Lydfeil</option><option value="empty">Ingen kanaler</option><option value="noapps">Ingen aktive apper</option></select><span class="sub">Simulerte data</span></div>
</div>
<script>
(()=>{const r=document.getElementById('nv'),q=s=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const base=()=>[{id:1,name:'Nettleser',midi:false,vol:62,mute:false,targets:['Firefox'],vs:true},{id:2,name:'Musikk',midi:false,vol:45,mute:false,targets:['Spotify'],vs:true},{id:3,name:'Samtale',midi:false,vol:64,mute:false,targets:['Discord','Vesktop'],vs:false},{id:5,name:'Systemlyd',midi:true,vol:72,mute:false,targets:['Systemlyd'],vs:false},{id:6,name:'Andre apper',midi:true,vol:35,mute:true,targets:['Andre apper'],vs:false}];let profiles={Hverdag:base(),Gaming:base().map(c=>({...c,vol:c.id===2?20:c.vol}))},profile='Hverdag',state='ready',editing=false,next=7,profileAction=null;const cs=()=>profiles[profile],say=s=>q('#nv-feedback').textContent=s,device=t=>['Systemlyd','Scarlett Solo','Innebygd lyd'].includes(t),groups=[['Apper',['Firefox','Spotify','Discord','Vesktop','Andre apper']],['Lydenheter',['Systemlyd','Scarlett Solo','Innebygd lyd']]];
function renderProfile(){q('#nv-profile').innerHTML=`<optgroup label="Bytt profil">${Object.keys(profiles).map(p=>`<option value="p:${esc(p)}" ${p===profile?'selected':''}>${esc(p)}</option>`).join('')}</optgroup><optgroup label="Profilhandlinger"><option value="new">Ny profil …</option><option value="copy">Dupliser profil …</option><option value="rename">Endre navn …</option><option value="delete">Slett profil …</option></optgroup>`}
function render(){q('#nv-audio').textContent=state==='error'?'Lyd frakoblet':state==='loading'?'Kobler til lyd …':'Lyd tilkoblet';q('#nv-add').disabled=state==='loading';q('#nv-edit').disabled=state==='loading';q('#nv-profile').disabled=state==='loading';q('#nv-delete').hidden=!editing;q('#nv-edit').setAttribute('aria-pressed',editing);let h='';if(state==='loading'){q('#nv-mixer').innerHTML='<p role="status">Henter kanaler og lydtilkoblinger …</p><div class="strips" aria-hidden="true"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div></div>';return}if(state==='error')h+='<div class="notice" role="alert"><p><strong>Lydsystemet er utilgjengelig.</strong> Profil og tilknytninger er beholdt.</p><button data-act="retry">Prøv igjen</button></div>';if(state==='empty'||!cs().length){q('#nv-mixer').innerHTML=h+'<div class="empty"><h2>Ingen kanaler i profilen</h2><p>Legg til en MIDI-kanal, eller åpne innstillinger for USB-oppsett.</p><button data-act="add">+ MIDI-kanal</button></div>';return}if(state==='noapps')h+='<div class="notice">Ingen aktive apper. Start avspilling; lagrede tilknytninger er beholdt.</div>';
h+='<div class="strips">'+cs().map(c=>`<section class="strip" data-channel="${c.id}" aria-label="${esc(c.name)}"><button class="mute" data-mute="${c.id}" aria-pressed="${c.mute}" ${state==='error'?'disabled':''}>${c.mute?'Dempet':'Demp'}</button><output class="level" id="nv-level-${c.id}">${c.vol} %</output><div class="fader"><input type="range" min="0" max="100" value="${c.vol}" data-vol="${c.id}" aria-label="Volum ${esc(c.name)}" aria-orientation="vertical" ${state==='error'?'disabled':''}></div><span class="channel-name">${esc(c.name)}</span><span class="id">${c.midi?'MIDI':'CH'} ${c.id}</span><hr class="divider"><details class="target"><summary aria-label="Velg apper eller enhet for ${esc(c.name)}">${esc(c.targets.join(' + ')||'Velg app / enhet')}</summary><div class="menu">${groups.map(([name,items])=>`<fieldset><legend>${name}</legend>${items.map(t=>`<label class="check"><input type="checkbox" data-target="${c.id}" value="${esc(t)}" ${c.targets.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</fieldset>`).join('')}<p class="tiny">Flere apper eller én lydenhet. En lydenhet erstatter appvalgene.</p><button class="apply" data-apply="${c.id}">Bruk valget</button></div></details><p class="tiny availability">${state==='noapps'&&!device(c.targets[0])?'Venter på app-lyd':device(c.targets[0])?'Lydenhet':c.targets.length?'Apper':'Ikke tilordnet'}</p><label class="check vs"><input type="checkbox" data-vs="${c.id}" ${c.vs?'checked':''} ${device(c.targets[0])?'disabled':''}>V-Sink</label><details class="options"><summary>Kanalvalg</summary><label>Navn<input type="text" value="${esc(c.name)}" data-name="${c.id}"></label><label class="check"><input type="checkbox" data-invert="${c.id}" ${c.invert?'checked':''}>Snu fader</label>${c.targets.filter(t=>!device(t)&&t!=='Andre apper').map(t=>`<label class="check"><input type="checkbox" data-pause="${c.id}" value="${esc(t)}" ${c.paused?.includes(t)?'checked':''}>Pause ruting: ${esc(t)}</label>`).join('')}<button data-move="${c.id}" data-step="-1">Flytt tidligere</button><button data-move="${c.id}" data-step="1">Flytt senere</button>${c.midi?`<button data-learn="${c.id}">${esc(c.cc||'Lær volum-CC')}</button><button data-learn-mute="${c.id}">${esc(c.mcc||'Lær dempe-CC')}</button>`:''}</details>${editing&&c.midi?`<label class="check editmark"><input type="checkbox" data-selected="${c.id}" ${c.selected?'checked':''}>Velg kanal</label>`:''}</section>`).join('')+'</div>';q('#nv-mixer').innerHTML=h}
function add(){if(state==='empty'){profiles[profile]=[];state='ready';q('#nv-state').value=state}cs().push({id:next++,name:'Ny MIDI-kanal',midi:true,vol:50,mute:false,targets:[],vs:false});render();const last=q('.strip:last-child .target');last.open=true;last.querySelector('summary').focus();say('Velg apper eller en lydenhet for den nye kanalen.')}
q('#nv-profile').onchange=e=>{const v=e.target.value;if(v.startsWith('p:')){profile=v.slice(2);render();say('Profil: '+profile);return}profileAction=v;renderProfile();q('#nv-profile-form').hidden=false;q('#nv-profile-error').textContent='';q('#nv-profile-name').value=v==='new'?'':v==='copy'?profile+' kopi':profile;q('#nv-profile-name').disabled=v==='delete';q('#nv-profile-submit button').textContent=v==='delete'?'Slett profilen':'Lagre';if(v==='delete')q('#nv-profile-error').textContent='Slett «'+profile+'»? De andre profilene beholdes.';q('#nv-profile-name').focus()};q('#nv-profile-cancel').onclick=()=>q('#nv-profile-form').hidden=true;q('#nv-profile-submit').onsubmit=e=>{e.preventDefault();const name=q('#nv-profile-name').value.trim();if(profileAction==='delete'){if(Object.keys(profiles).length<2){q('#nv-profile-error').textContent='Behold minst én profil.';return}delete profiles[profile];profile=Object.keys(profiles)[0]}else{if(!name||(profiles[name]&&name!==profile)){q('#nv-profile-error').textContent='Velg et unikt profilnavn.';return}if(name===profile&&profileAction!=='rename'){q('#nv-profile-error').textContent='Velg et nytt profilnavn.';return}const old=profile;profiles[name]=profileAction==='new'?[]:JSON.parse(JSON.stringify(cs()));if(profileAction==='rename'&&name!==old)delete profiles[old];profile=name}q('#nv-profile-form').hidden=true;renderProfile();render();say('Profilen er oppdatert i prototypen.')};q('#nv-settings-toggle').onclick=()=>{const hidden=!q('#nv-settings').hidden;q('#nv-settings').hidden=hidden;q('#nv-settings-toggle').setAttribute('aria-expanded',!hidden);q('#nv-settings-toggle').textContent=(hidden?'▸':'▾')+' Innstillinger'};q('#nv-compact').onchange=e=>r.classList.toggle('compact',e.target.checked);q('#nv-stay').onchange=e=>say(e.target.checked?'Hold åpent er valgt (simulert).':'Hold åpent er slått av (simulert).');q('#nv-state').onchange=e=>{state=e.target.value;render();say('')};q('#nv-add').onclick=add;q('#nv-edit').onclick=()=>{editing=!editing;render()};q('#nv-delete').onclick=()=>{const chosen=cs().filter(c=>c.midi&&c.selected);profiles[profile]=cs().filter(c=>!(c.midi&&c.selected));render();say(chosen.length+' MIDI-kanaler slettet i prototypen.')};q('#nv-mode').onchange=e=>{q('#nv-midi-field').hidden=e.target.value==='usb';q('#nv-usb-field').hidden=e.target.value==='midi';q('#nv-add').hidden=e.target.value==='usb';q('#nv-edit').hidden=e.target.value==='usb';say('Viser oppsettet for valgt inndatamodus (simulert).')};q('#nv-remote').onchange=e=>{e.target.closest('details').querySelector('summary').textContent='Fjernkontroll · '+e.target.value};
r.addEventListener('input',e=>{const id=e.target.dataset.vol;if(id){const c=cs().find(c=>c.id===+id);c.vol=+e.target.value;q('#nv-level-'+id).textContent=c.vol+' %'}});
r.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.target){const strip=t.closest('.strip');if(t.checked)strip.querySelectorAll('[data-target]').forEach(x=>{if(x!==t&&(device(t.value)||device(x.value)))x.checked=false})}for(const [key,prop]of [['vs','vs'],['invert','invert'],['selected','selected']])if(d[key])cs().find(c=>c.id===+d[key])[prop]=t.checked;if(d.pause){const c=cs().find(c=>c.id===+d.pause);c.paused=c.paused||[];c.paused=t.checked?[...c.paused,t.value]:c.paused.filter(x=>x!==t.value)}if(d.name){const c=cs().find(c=>c.id===+d.name);if(t.value.trim()){c.name=t.value.trim();render();say('Kanalnavnet er oppdatert.')}}});
r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.mute){const c=cs().find(c=>c.id===+d.mute);c.mute=!c.mute;b.setAttribute('aria-pressed',c.mute);b.textContent=c.mute?'Dempet':'Demp';say(c.name+(c.mute?' dempet.':' har lyd på.'))}if(d.apply){const c=cs().find(c=>c.id===+d.apply);c.targets=[...b.closest('.strip').querySelectorAll('[data-target]:checked')].map(x=>x.value);if(device(c.targets[0]))c.vs=false;render();q(`[data-channel="${c.id}"] summary`).focus();say('Tilknytninger lagret for '+c.name+'.')}if(d.move){const i=cs().findIndex(c=>c.id===+d.move),j=i+(+d.step);if(j>=0&&j<cs().length)[cs()[i],cs()[j]]=[cs()[j],cs()[i]];render();say('Rekkefølgen er oppdatert. Kanalnummer og binding er beholdt.')}if(d.learn||d.learnMute){const c=cs().find(c=>c.id===+(d.learn||d.learnMute));if(d.learn)c.cc='Volum: CC 7';else c.mcc='Demping: CC 8';b.textContent=d.learn?c.cc:c.mcc;say('MIDI-læring simulert.')}if(d.act==='add')add();if(d.act==='retry'){state='loading';q('#nv-state').value=state;render();setTimeout(()=>{if(state==='loading'){state='ready';q('#nv-state').value=state;render();say('Tilkoblet igjen (simulert).')}},900)}});renderProfile();render();if(globalThis.Tweak){const opts={compact:false};const t=new Tweak({container:r,onChange:()=>{q('#nv-compact').checked=opts.compact;r.classList.toggle('compact',opts.compact)}});t.addToggle(opts,'compact',{label:'Kompakt visning'})}
})();
</script>
